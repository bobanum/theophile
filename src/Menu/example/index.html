<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="style.css">
	<script type="module" src="../Menu.js"></script>
	<title>Document</title>
</head>

<body>
	<h1>Menu</h1>
	<section id="scale"></section>
	<p>Menu is a component that allows you to create a menu with submenus. It can be used to create a navigation menu for your website.</p>
	<section class="examples">

		<h2>Inline</h2>
		<nav>
			<th-menu style="--sub-icon:none">
				<th-menu-item label="Home" href="index.html" icon="home"></th-menu-item>
				<th-menu-item label="Courses" icon="book">
					<th-menu>
						<th-menu-item label="Course 1" href="courses/01.html"></th-menu-item>
						<th-menu-item label="Course 2" icon="folder">
							<th-menu>
								<th-menu-item label="Lesson 1" href="courses/02/lesson1.html"></th-menu-item>
								<th-menu-item label="Lesson 2" href="courses/02/lesson2.html" disabled></th-menu-item>
							</th-menu>
						</th-menu-item>
					</th-menu>
				</th-menu-item>
				<th-menu-item label="Contact" href="contact.html" icon="person"></th-menu-item>
				<th-menu-item label="About" href="about.html" icon="info"></th-menu-item>
				<th-menu-item label="Blog" icon="edit">
					<th-menu>
						<th-menu-item label="Latest Posts" href="blog/latest.html"></th-menu-item>
						<th-menu-item label="Archive" href="blog/archive.html"></th-menu-item>
					</th-menu>
				</th-menu-item>
			</th-menu>
		</nav>
		<h2>Javascript</h2>
		<nav>
			<th-menu src="menu.js"></th-menu>
		</nav>
		<h2>JSON</h2>
		<nav>
			<th-menu src="menu.json"></th-menu>
		</nav>
		<h2>HTML</h2>
		<nav>
			<th-menu src="menu.html"></th-menu>
		</nav>
		<h2>Text</h2>
		<nav>
			<th-menu src="menu.txt"></th-menu>
		</nav>
	</section>
</body>

</html>
